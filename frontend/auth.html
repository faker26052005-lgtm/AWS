<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Quản Lý Công Việc</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <h1>📋 Quản Lý Công Việc</h1>
            
            <!-- Login Form -->
            <div id="login-form" class="form-container active">
                <h2>Đăng Nhập</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="login-email">Email:</label>
                        <input type="email" id="login-email" placeholder="example@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Mật khẩu:</label>
                        <input type="password" id="login-password" placeholder="Nhập mật khẩu" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Đăng Nhập</button>
                </form>
                <p class="form-footer">
                    Chưa có tài khoản? 
                    <button type="button" class="link-btn" id="to-signup-btn">Đăng Ký tại đây</button>
                </p>
            </div>

            <!-- Sign Up Form -->
            <div id="signup-form" class="form-container">
                <h2>Tạo Tài Khoản Mới</h2>
                <form id="signupForm">
                    <div class="form-group">
                        <label for="signup-name">Họ Tên:</label>
                        <input type="text" id="signup-name" placeholder="Nhập họ tên đầy đủ" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-email">Email:</label>
                        <input type="email" id="signup-email" placeholder="example@mail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-password">Mật khẩu:</label>
                        <input type="password" id="signup-password" placeholder="Tối thiểu 6 ký tự" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-confirm-password">Xác nhận mật khẩu:</label>
                        <input type="password" id="signup-confirm-password" placeholder="Nhập lại mật khẩu" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Đăng Ký</button>
                </form>
                <p class="form-footer">
                    Đã có tài khoản? 
                    <button type="button" class="link-btn" id="to-login-btn">Đăng Nhập tại đây</button>
                </p>
            </div>

            <div id="auth-message" class="message"></div>

            <!-- Demo Info -->
            <div class="demo-info">
                <p><strong>🧪 Test Account:</strong></p>
                <p>Email: <code>demo@mail.com</code></p>
                <p>Password: <code>123456</code></p>
            </div>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="auth.js"></script>
</body>
</html>
