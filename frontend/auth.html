<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập Hệ Thống</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/oidc-client-ts/3.0.1/browser/oidc-client-ts.min.js"></script>
    <script src="config.js"></script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card" style="text-align: center;">
            <h1>📋 Quản Lý Công Việc</h1>
            <h2>Hệ Thống Đám Mây Serverless</h2>
            <p style="margin: 20px 0; color: #666;">Vui lòng đăng nhập bằng tài khoản AWS Cognito để tiếp tục làm việc.</p>
            
            <button id="signIn" class="btn btn-primary" style="padding: 12px;">
                🔐 Đăng Nhập Với AWS Hosted UI
            </button>
        </div>
    </div>

    <script>
        // Bắt sự kiện click để tự động nhảy sang trang đăng nhập của AWS Cloud
        document.getElementById("signIn").addEventListener("click", async () => {
            if (userManager) {
                await userManager.signinRedirect();
            }
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/oidc-client-ts/3.0.1/browser/oidc-client-ts.min.js"></script>  
    <!-- Configuration & Utilities -->
    <script src="config.js"></script>
    <script src="shared.js"></script>
    <script src="auth.js"></script>
</body>
</html>
